services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d scheduler']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
