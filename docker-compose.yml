services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d scheduler']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    # Migrations and seed run on every start. Both are safe to run again: the
    # migrator skips what is applied, the seed inserts with ON CONFLICT DO
    # NOTHING. If either fails, the API doesn't start on a half set up database.
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/db/seed.js && node dist/main.js']
    restart: on-failure
    environment:
      PORT: 3000
      DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler
    ports:
      - '3000:3000'
    # Healthy once /health/ready says the database answers. The image has no
    # curl, so node does the request. start_period covers the migrations and
    # the seed on start.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
