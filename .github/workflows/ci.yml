name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # One script so CI and a local run are the same gate.
      # Integration and e2e tests start Postgres with Testcontainers, which works on the hosted runner's Docker.
      - run: npm run ci
